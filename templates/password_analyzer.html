<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberForge | Password Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body style="background:#050816; color:white;">

    <div class="topbar" style="padding: 25px; background: #0b1020; border-bottom: 1px solid #1b2b45; display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h1 style="margin: 0; color: white; font-size: 24px;"><i class="fa-solid fa-key" style="color: #00ff99; margin-right: 10px;"></i>Advanced Password Analyzer</h1>
            <p style="margin: 5px 0 0 0; color: #94a3b8;">Evaluate credential complexity and entropy metrics</p>
        </div>
        <a href="/dashboard" class="logout-btn" style="background: #1e293b; color: #00ff99; border: 1px solid #334155; text-decoration: none; padding: 10px 20px; border-radius: 6px; font-weight: bold;">← Dashboard</a>
    </div>

    <div style="max-width: 800px; margin: 40px auto; padding: 0 20px;">
        <div class="panel" style="background: #101827; border-radius: 12px; padding: 30px; border: 1px solid #1e293b;">
            <h2 style="color: #00ff99; margin-top: 0; margin-bottom: 20px;">Test Password Strength</h2>
            
            <label style="color: #94a3b8; font-size: 14px;">Enter a password to analyze:</label>
            <input type="password" id="passInput" placeholder="Type password..." onkeyup="analyzePassword()" 
                   style="width: 100%; padding: 14px; margin-top: 10px; margin-bottom: 20px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 6px; box-sizing: border-box; font-size: 16px;">

            <div style="background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #1e293b; margin-bottom: 25px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <span style="color: #94a3b8;">Analysis Result:</span>
                    <strong id="statusLabel" style="font-size: 18px; color: #cbd5e1;">--</strong>
                </div>
                <div style="height: 8px; background: #1e293b; border-radius: 10px; overflow: hidden;">
                    <div id="progressBar" style="height: 100%; width: 0%; background: #00ff99; transition: 0.3s;"></div>
                </div>
            </div>

            <h3 style="color: #00ff99; font-size: 16px; margin-bottom: 15px;">Complexity Requirements:</h3>
            <ul style="list-style: none; padding: 0; margin: 0; color: #d1d5db; line-height: 2;">
                <li id="rule-length">❌ Minimum 6 Characters</li>
                <li id="rule-upper">❌ Contains Uppercase Letter</li>
                <li id="rule-number">❌ Contains Number</li>
                <li id="rule-special">❌ Contains Special Character</li>
            </ul>
        </div>
    </div>

    <script>
    function analyzePassword() {
        let password = document.getElementById("passInput").value;
        let status = document.getElementById("statusLabel");
        let bar = document.getElementById("progressBar");

        let hasUpper = /[A-Z]/.test(password);
        let hasNumber = /[0-9]/.test(password);
        let hasSpecial = /[^A-Za-z0-9]/.test(password);

        // Update Checklist Rules visually
        document.getElementById("rule-length").innerHTML = password.length >= 6 ? "✔ Minimum 6 Characters" : "❌ Minimum 6 Characters";
        document.getElementById("rule-length").style.color = password.length >= 6 ? "#00ff99" : "#ff4444";
        
        document.getElementById("rule-upper").innerHTML = hasUpper ? "✔ Contains Uppercase Letter" : "❌ Contains Uppercase Letter";
        document.getElementById("rule-upper").style.color = hasUpper ? "#00ff99" : "#ff4444";
        
        document.getElementById("rule-number").innerHTML = hasNumber ? "✔ Contains Number" : "❌ Contains Number";
        document.getElementById("rule-number").style.color = hasNumber ? "#00ff99" : "#ff4444";
        
        document.getElementById("rule-special").innerHTML = hasSpecial ? "✔ Contains Special Character" : "❌ Contains Special Character";
        document.getElementById("rule-special").style.color = hasSpecial ? "#00ff99" : "#ff4444";

        if (password.length === 0) {
            status.innerHTML = "--";
            status.style.color = "#cbd5e1";
            bar.style.width = "0%";
            return;
        }

        // Matches your standalone project evaluation criteria[cite: 16]
        if (password.length < 6) {
            status.innerHTML = "WEAK";
            status.style.color = "#ff4444";
            bar.style.width = "25%";
            bar.style.backgroundColor = "#ff4444";
        }
        else if (hasUpper && hasNumber && hasSpecial) {
            status.innerHTML = "STRONG";
            status.style.color = "#00ff99";
            bar.style.width = "100%";
            bar.style.backgroundColor = "#00ff99";
        }
        else {
            status.innerHTML = "MEDIUM";
            status.style.color = "orange";
            bar.style.width = "60%";
            bar.style.backgroundColor = "orange";
        }
    }
    </script>
</body>
</html>
